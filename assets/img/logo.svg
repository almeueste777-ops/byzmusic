<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="byzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#851e25" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#byzGrad)" />
  <!-- Byzantine Cross & Music Neume Emblem -->
  <g fill="#fef3c7" stroke="#fef3c7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Vertical Cross beam -->
    <rect x="46" y="18" width="8" height="64" rx="3" fill="#fef3c7" />
    <!-- Main Horizontal Beam -->
    <rect x="24" y="34" width="52" height="8" rx="3" fill="#fef3c7" />
    <!-- Upper Inscription Bar -->
    <rect x="34" y="24" width="32" height="5" rx="2.5" fill="#fef3c7" />
    <!-- Lower Slanted Footrest (Suppedaneum) -->
    <polygon points="32,68 68,60 68,66 32,74" fill="#fef3c7" />
    <!-- Decorative Byzantine Flairs -->
    <circle cx="50" cy="18" r="3" fill="#fbbf24" />
    <circle cx="50" cy="82" r="3" fill="#fbbf24" />
    <circle cx="24" cy="38" r="3" fill="#fbbf24" />
    <circle cx="76" cy="38" r="3" fill="#fbbf24" />
  </g>
</svg>
